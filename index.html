<!doctype html>
<html lang="it">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bee&amp;blu: un trilocale luminoso in via Bressanone, Milano. Self check-in, check-in online e consigli su cosa fare in città.">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<title>Bee&amp;blu Milano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;0,9..40,900&display=swap">
<style>
/* Layout: mobile first, con versione desktop da 960px. Forme a goccia come il logo, un solo accento: il blu. */
:root {
  --blu: #003DB2;
  --blu-forte: #002C82;
  --crema: #FEFDF8;
  --cielo: #E5ECFB;
  --inchiostro: #0B1B44;
  --tenue: #4C5A7D;
  --bordo: #D3DDF5;
  --bg: var(--crema);
  --fondo-esterno: #DCE5FA;
  --fg: var(--inchiostro);
  --superficie: #FFFFFF;
  --su-blu: #FEFDF8;
  --errore: #C8322A;
  --wa: #1FA855;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-blob: 40px;
  --r-pill: 999px;
  --g: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07122E; --fondo-esterno: #030A1C; --fg: #F1F3FB; --superficie: #0E1C45; --cielo: #13265A;
    --tenue: #A9B6D8; --bordo: #263C7A; --blu: #6E96FF; --blu-forte: #2A5BDB; --su-blu: #07122E; --errore: #FF7A70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07122E; --fondo-esterno: #030A1C; --fg: #F1F3FB; --superficie: #0E1C45; --cielo: #13265A;
  --tenue: #A9B6D8; --bordo: #263C7A; --blu: #6E96FF; --blu-forte: #2A5BDB; --su-blu: #07122E; --errore: #FF7A70; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--fondo-esterno); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.sito { max-width: 440px; margin: 0 auto; background: var(--bg); min-height: 100vh; position: relative; overflow-x: clip; }
@media (min-width: 520px) { .sito { margin-block: 24px; border-radius: 36px; box-shadow: 0 30px 80px rgba(0, 30, 100, .18); } }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blu); outline-offset: 3px; border-radius: 12px; }
h1, h2, h3 { margin: 0; line-height: 0.95; letter-spacing: -0.04em; text-wrap: balance; font-weight: 900; }
p { margin: 0; }
.etichetta { font-size: 15px; font-weight: 700; color: var(--blu); }

.logo-crema { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-blu { display: none; } :root:not([data-theme="light"]) .logo-crema { display: block; } }
:root[data-theme="dark"] .logo-blu { display: none; }
:root[data-theme="dark"] .logo-crema { display: block; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; gap: 10px; padding: 10px var(--g); }
@media (min-width: 520px) { .top { border-radius: 36px 36px 0 0; } }
.top .marchio { display: flex; align-items: center; text-decoration: none; margin-right: auto; }
.top .marchio img { width: 40px; height: auto; }
.top .btn { padding: 10px 16px; font-size: 15px; }
.lingua { display: flex; background: var(--cielo); border-radius: var(--r-pill); padding: 3px; }
.lingua button { font: inherit; font-size: 14px; font-weight: 700; border: 0; background: transparent; color: var(--tenue); padding: 7px 11px; border-radius: var(--r-pill); cursor: pointer; }
.lingua button[aria-pressed="true"] { background: var(--superficie); color: var(--blu); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 17px; text-decoration: none; border-radius: var(--r-pill); padding: 15px 22px; background: var(--blu); color: var(--su-blu); transition: transform .15s ease; }
.btn:active { transform: scale(.97); }
.btn.vuoto { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--bordo); }
.btn.chiaro { background: var(--cielo); color: var(--blu); }
.btn.largo { width: 100%; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

/* hero */
.hero { padding: 8px var(--g) 40px; }
.hero { padding-top: 26px; }
.hero .cornice { position: relative; aspect-ratio: 4 / 5; max-width: 100%; }
.hero .cornice img { border-radius: 34px; background: var(--cielo); box-shadow: 0 22px 50px rgba(0, 30, 100, .16); }
.hero .cornice img { width: 100%; height: 100%; object-fit: cover; }
.hero .bollo { position: absolute; right: -8px; top: -22px; z-index: 2; width: 112px; aspect-ratio: 1; border-radius: 50%; background: var(--bg); display: grid; place-items: center; box-shadow: 0 14px 30px rgba(0, 30, 100, .22), inset 0 0 0 3px var(--bg); transform: rotate(-8deg); animation: galleggia 5s ease-in-out infinite; }
.hero .bollo img { width: 74%; }
@keyframes galleggia { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
.hero h1 { font-size: 76px; color: var(--blu); margin-top: 26px; }
.hero .lead { margin-top: 16px; font-size: 19px; color: var(--tenue); }
.hero .azioni { display: grid; gap: 10px; margin-top: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.chip { font-size: 14px; font-weight: 500; padding: 7px 13px; border-radius: var(--r-pill); background: var(--cielo); color: var(--fg); }

.blocco { padding: 48px var(--g); }
h2.titolo { font-size: 50px; margin-top: 10px; }
.intro { margin-top: 14px; color: var(--tenue); font-size: 17px; }

/* casa */
.casa figure { margin: 22px 0 0; }
.casa figure img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: var(--r-blob) var(--r-blob) var(--r-blob) 140px; }
.casa figcaption { margin-top: 10px; font-size: 14px; color: var(--tenue); }
.dotazioni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 20px 0 0; padding: 0; }
.dotazioni li { list-style: none; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; padding: 13px 14px; background: var(--superficie); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--bordo); min-width: 0; }
.dotazioni svg { width: 22px; height: 22px; flex: none; color: var(--blu); }

/* soggiorno */
.passi { display: grid; gap: 10px; margin: 24px 0 0; padding: 0; }
.passi li { list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; background: var(--cielo); border-radius: 28px; padding: 18px; }
.passi .n { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; background: var(--blu); color: var(--su-blu); display: grid; place-items: center; font-weight: 800; font-size: 19px; }
.passi h3 { font-size: 21px; letter-spacing: -0.02em; line-height: 1.1; }
.passi p { color: var(--tenue); font-size: 15px; }

/* milano */
.milano { background: var(--cielo); border-radius: var(--r-blob); margin-inline: 8px; padding: 40px 0 28px; }
.milano .pad { padding-inline: 24px; }
.filtri { display: flex; gap: 8px; overflow-x: auto; padding: 18px 24px 4px; scrollbar-width: none; }
.filtri::-webkit-scrollbar { display: none; }
.filtri button { flex: none; font: inherit; font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: var(--r-pill); border: 0; background: var(--superficie); color: var(--fg); cursor: pointer; }
.filtri button[aria-pressed="true"] { background: var(--blu); color: var(--su-blu); }
.idee { display: grid; gap: 10px; margin-top: 14px; padding-inline: 12px; }
.idea { background: var(--superficie); border-radius: 28px; padding: 18px 18px 16px; display: grid; gap: 8px; }
.idea.evidenza { box-shadow: 0 0 0 3px var(--blu); animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.03); } }
.idea .testa { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.idea h3 { font-size: 22px; letter-spacing: -0.02em; line-height: 1.1; }
.idea .dove-quando { font-size: 14px; color: var(--tenue); }
.idea p { font-size: 15px; color: var(--tenue); }
.idea .link { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.idea .link a { font-size: 14px; font-weight: 700; text-decoration: none; padding: 8px 14px; border-radius: var(--r-pill); background: var(--cielo); color: var(--blu); }
.idea .link a.primo { background: var(--blu); color: var(--su-blu); }
.badge { flex: none; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: var(--r-pill); background: var(--cielo); color: var(--blu); white-space: nowrap; }
.badge.forte { background: var(--blu); color: var(--su-blu); }
.sorpresa { margin: 16px 12px 0; }
.aggiornato { font-size: 13px; color: var(--tenue); margin: 14px 24px 0; }
.vuoto-msg { text-align: center; color: var(--tenue); padding: 24px; }

/* dove */
.orari { display: grid; margin: 20px 0 0; }
.orari div { display: flex; justify-content: space-between; gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--bordo); }
.orari dt { color: var(--tenue); }
.orari dd { margin: 0; font-weight: 700; text-align: right; }

/* check-in */
.checkin { background: var(--blu); color: var(--su-blu); border-radius: var(--r-blob); margin-inline: 8px; padding: 40px 12px 14px; }
.checkin .pad { padding-inline: 12px; }
.checkin .etichetta { color: var(--su-blu); opacity: .8; }
.checkin h2 { font-size: 52px; margin-top: 10px; }
.checkin .intro { color: var(--su-blu); opacity: .85; }
.rassicura { margin: 20px 0 0; padding: 0; display: grid; gap: 10px; }
.rassicura li { list-style: none; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.rassicura svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
.pannello { background: var(--superficie); color: var(--fg); border-radius: 30px; padding: 22px 18px; margin-top: 24px; }
.avanzamento { display: flex; gap: 6px; margin-bottom: 20px; }
.avanzamento span { flex: 1; height: 6px; border-radius: 6px; background: var(--cielo); transition: background .3s; }
.avanzamento span.on { background: var(--blu); }
.pannello h3 { font-size: 30px; letter-spacing: -0.03em; }
.pannello .sotto { color: var(--tenue); margin-top: 8px; font-size: 15px; }
.campi { display: grid; gap: 14px; margin-top: 20px; }
.campo { display: grid; gap: 6px; min-width: 0; }
.campo label { font-size: 14px; font-weight: 700; }
.campo input, .campo select { font: inherit; font-size: 17px; width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--bordo); background: var(--bg); color: var(--fg); min-width: 0; }
.campo input:focus, .campo select:focus { outline: none; border-color: var(--blu); }
.campo input.codice { letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; font-variant-numeric: tabular-nums; }
.campo.errore input, .campo.errore select { border-color: var(--errore); }
.campo .msg { font-size: 13px; color: var(--errore); font-weight: 500; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; font: inherit; font-size: 15px; font-weight: 700; padding: 12px 8px; border-radius: var(--r-pill); border: 2px solid var(--bordo); background: var(--bg); color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--blu); border-color: var(--blu); color: var(--su-blu); }
.azioni-p { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: 22px; }
.azioni-p.solo { grid-template-columns: 1fr; }
.doc { margin-top: 20px; border: 2px dashed var(--bordo); border-radius: 24px; padding: 18px; display: flex; gap: 14px; align-items: center; cursor: pointer; position: relative; }
.doc input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.doc .ico { width: 52px; height: 52px; flex: none; border-radius: 16px; background: var(--cielo); display: grid; place-items: center; color: var(--blu); }
.doc .ico svg { width: 26px; height: 26px; }
.doc strong { display: block; font-size: 16px; }
.doc span { font-size: 14px; color: var(--tenue); }
.doc.letto { border-style: solid; border-color: var(--blu); background: var(--cielo); }
.doc .anteprima { width: 52px; height: 52px; flex: none; border-radius: 16px; object-fit: cover; }
.campo .msg.avviso { color: #9A6100; }
.campo.avviso input, .campo.avviso select { border-color: #D19A2A; }
.suggerimenti { display: flex; flex-wrap: wrap; gap: 6px; }
.suggerimenti button { font: inherit; font-size: 14px; font-weight: 700; padding: 7px 12px; border-radius: var(--r-pill); border: 2px solid var(--blu); background: var(--bg); color: var(--blu); cursor: pointer; }
.docblocco { margin-top: 20px; display: grid; gap: 12px; }
.consigli { list-style: none; padding: 14px 16px; margin: 0; border-radius: 20px; background: var(--cielo); display: grid; gap: 6px; font-size: 14px; }
.consigli li { display: flex; gap: 8px; align-items: flex-start; }
.consigli li::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--blu); margin-top: 7px; }
.slot-griglia { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.slot-griglia .doc { margin-top: 0; flex-direction: column; text-align: center; padding: 14px; gap: 8px; }
.slot-griglia .doc .anteprima { width: 100%; height: 96px; border-radius: 12px; }
.doc.errore { border-color: var(--errore); }
.doc .stato { font-size: 13px; font-weight: 600; }
.doc .stato.ok { color: var(--blu); } .doc .stato.ko { color: var(--errore); } .doc .stato.attenzione { color: #9A6100; }
.doc .usa { position: relative; z-index: 1; font: inherit; font-size: 13px; font-weight: 700; color: var(--blu); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
.prenot { margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.prenot div { background: var(--cielo); border-radius: 18px; padding: 12px; min-width: 0; }
.prenot small { display: block; font-size: 12px; color: var(--tenue); }
.prenot b { font-size: 19px; font-variant-numeric: tabular-nums; }
.riepilogo { margin-top: 18px; display: grid; gap: 8px; }
.riepilogo .persona { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 20px; background: var(--cielo); }
.riepilogo .persona b { display: block; }
.riepilogo .persona small { color: var(--tenue); font-size: 13px; }
.consenso { display: flex; gap: 12px; align-items: flex-start; margin-top: 18px; font-size: 14px; color: var(--tenue); }
.consenso input { width: 22px; height: 22px; accent-color: var(--blu); flex: none; margin-top: 1px; }
.consenso button { font: inherit; color: var(--blu); font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.fatto { text-align: center; padding-block: 8px; display: grid; justify-items: center; gap: 12px; }
.fatto .ape { width: 110px; }
.fatto h3 { font-size: 44px; }

/* footer */
footer { padding: 48px var(--g) 110px; display: grid; gap: 18px; justify-items: start; }
footer .logo-grande { width: 150px; }
footer .grosso { color: var(--blu); font-size: 38px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
footer p { color: var(--tenue); font-size: 15px; }
.legale { display: grid; gap: 4px; font-size: 13px; color: var(--tenue); padding-top: 16px; border-top: 1px solid var(--bordo); width: 100%; }
.legale b { color: var(--fg); font-variant-numeric: tabular-nums; }
.legale .btn { margin-top: 10px; padding: 10px 16px; font-size: 14px; justify-self: start; }

/* privacy */
.privacy { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
.privacy .dentro { max-width: 440px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) var(--g) calc(40px + env(safe-area-inset-bottom, 0px)); }
.privacy .chiudi { position: sticky; top: 0; display: flex; justify-content: flex-end; padding-block: 4px 12px; background: var(--bg); }
.privacy h2 { font-size: 44px; }
.privacy h3 { font-size: 20px; letter-spacing: -0.02em; line-height: 1.15; margin-top: 26px; }
.privacy p, .privacy li { font-size: 15px; color: var(--tenue); margin-top: 8px; }
.privacy ul { padding-left: 20px; margin: 0; }
.privacy .data { margin-top: 10px; font-size: 13px; }

/* whatsapp fisso */
.wa { position: fixed; z-index: 30; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, calc(50vw - 220px + 16px)); display: inline-flex; align-items: center; gap: 8px; padding: 13px 18px 13px 14px; border-radius: var(--r-pill); background: var(--wa); color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 10px 30px rgba(0, 40, 20, .25); }
.wa svg { width: 24px; height: 24px; }
.wa { transition: opacity .25s ease, transform .25s ease; }
.wa.nascosto { opacity: 0; transform: translateY(20px); pointer-events: none; }
.logo-m { display: block; aspect-ratio: 263 / 297; background: var(--blu); -webkit-mask: url(img/logo.svg) center / contain no-repeat; mask: url(img/logo.svg) center / contain no-repeat; }
.top .marchio .logo-m { width: 40px; }
.hero .bollo .logo-m { width: 74%; }
footer .logo-grande { width: 150px; }
.fatto .ape { width: 110px; }
.foto-sito { background: var(--cielo); }
.nav-desk { display: none !important; }

/* ---------- Desktop (da 960px) ---------- */
@media (min-width: 960px) {
  :root { --g: 56px; }
  .sito { max-width: 1240px; margin-block: 28px; border-radius: 48px; }
  .top { padding: 18px var(--g); border-radius: 48px 48px 0 0; }
  .top .marchio .logo-m { width: 52px; }
  .top .btn { padding: 12px 22px; font-size: 16px; }
  .nav-desk { display: flex !important; gap: 4px; margin-right: 12px; }
  .nav-desk a { text-decoration: none; font-weight: 700; font-size: 15px; color: var(--tenue); padding: 9px 14px; border-radius: var(--r-pill); }
  .nav-desk a:hover { background: var(--cielo); color: var(--blu); }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; column-gap: 64px; align-content: center; padding: 40px var(--g) 72px; }
  .hero > * { grid-column: 1; }
  .hero .cornice { grid-column: 2; grid-row: 1 / span 5; align-self: center; aspect-ratio: 4 / 5; max-height: 680px; width: 100%; }
  .hero h1 { font-size: clamp(96px, 9.5vw, 132px); margin-top: 0; align-self: end; }
  .hero .lead { font-size: 22px; max-width: 30ch; }
  .hero .azioni { grid-template-columns: auto auto; justify-content: start; }
  .hero .azioni .btn { width: auto; padding-inline: 28px; }
  .hero .bollo { width: 140px; right: -24px; top: -28px; }

  .blocco { padding: 72px var(--g); }
  h2.titolo { font-size: 68px; }
  .intro { font-size: 19px; max-width: 46ch; }

  .casa { display: grid; grid-template-columns: 1fr 1fr; column-gap: 64px; align-items: start; }
  .casa > * { grid-column: 1; }
  .casa figure { grid-column: 2; grid-row: 1 / span 5; margin: 0; }
  .casa figure img { aspect-ratio: 4 / 5; }
  .dotazioni { margin-top: 32px; }

  .passi { grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 32px; }
  .passi li { grid-template-columns: 1fr; align-content: start; padding: 24px; gap: 10px; }
  .passi .n { grid-row: auto; }

  .milano { margin-inline: 24px; padding: 64px 0 40px; }
  .milano .pad { padding-inline: 40px; }
  .filtri { padding-inline: 40px; }
  .idee { grid-template-columns: repeat(3, 1fr); gap: 14px; padding-inline: 28px; }
  .sorpresa { margin: 20px 40px 0; max-width: 360px; }
  .aggiornato { margin-inline: 40px; }

  #dove { display: grid; grid-template-columns: 1fr 1fr; column-gap: 64px; align-items: start; }
  #dove > * { grid-column: 1; }
  #dove .orari { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; }
  #dove > .btn { width: auto; justify-self: start; padding-inline: 28px; }

  .checkin { margin-inline: 24px; padding: 64px 40px 40px; display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .checkin .pad { position: sticky; top: 110px; padding: 0; }
  .checkin h2 { font-size: 68px; }
  .checkin .pannello { margin-top: 0; padding: 32px 30px; }
  .slot-griglia .doc .anteprima { height: 120px; }

  footer { grid-template-columns: auto 1fr; column-gap: 48px; align-items: center; padding: 64px var(--g) 64px; }

  // Legge l'immagine, misura risoluzione, luce, riflessi e nitidezza, e la riduce a max 2000 px (JPEG).
  function analizza(file) {
    return new Promise((ok) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const lato = Math.max(img.naturalWidth, img.naturalHeight);
        const s = Math.min(1, 2000 / lato);
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        // Versione piccola in scala di grigi per le misure
        const k = Math.min(1, 640 / Math.max(c.width, c.height));
        const w = Math.max(1, Math.round(c.width * k)), h = Math.max(1, Math.round(c.height * k));
        const m = document.createElement('canvas'); m.width = w; m.height = h;
        const mx = m.getContext('2d'); mx.drawImage(c, 0, 0, w, h);
        const px = mx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
        let somma = 0, bruciati = 0;
        for (let i = 0; i < w * h; i++) {
          const y = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
          g[i] = y; somma += y; if (y > 250) bruciati++;
        }
        // Nitidezza: varianza del laplaciano (bassa = foto mossa o sfocata)
        let n = 0, med = 0, q = 0;
        for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
          const i = y * w + x, l = g[i - 1] + g[i + 1] + g[i - w] + g[i + w] - 4 * g[i];
          n++; const d = l - med; med += d / n; q += d * (l - med);
        }
        ok({
          dati: c.toDataURL('image/jpeg', 0.85),
          lato, luce: somma / (w * h), riflesso: bruciati / (w * h), nitidezza: n ? q / n : 0,
        });
      };
      img.onerror = () => { URL.revokeObjectURL(url); ok(null); };
      img.src = url;
    });
  }
  async function preparaFoto(file) {
    if (file.size > 25 * 1024 * 1024) return { errore: 'ci.fotoGrande' };
    const a = await analizza(file);
    if (!a) {
      // Foto HEIC che il browser non sa aprire: la mandiamo così com'è (il server la accetta) se non è enorme
      if (/hei[cf]/i.test(file.type) && file.size <= 8 * 1024 * 1024) {
        const dati = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(file); });
        return { dati, avviso: null };
      }
      return { errore: 'ci.fotoFormato' };
    }
    if (a.lato < 1000) return { errore: 'ci.fotoPiccola' };
    const avviso = a.nitidezza < 45 ? 'ci.fotoSfocata' : a.luce < 55 ? 'ci.fotoScura' : a.riflesso > 0.08 ? 'ci.fotoRiflesso' : null;
    return { dati: a.dati, avviso };
  }

  function avanza(n) { ci.passo = n; render(); }
  function render() { ci.salva = null; barre.forEach((b, i) => b.classList.toggle('on', i <= ci.passo)); ({ 0: codice, 1: ospite, 2: riepilogo, 3: fatto })[ci.passo](); }

  function codice(msg = '') {
    const val = schermo.querySelector('#codice')?.value ?? ci.codice;
    schermo.innerHTML = `
      <h3>${t('ci.cerca')}</h3>
      <p class="sotto">${t('ci.cercaSotto')}</p>
      <form id="f-codice" novalidate>
        <div class="campi"><div class="campo ${msg ? 'errore' : ''}"><label for="codice">${t('ci.codice')}</label>
          <input id="codice" class="codice" autocomplete="off" autocapitalize="characters" placeholder="HMABC12345" value="${esc(val)}">
          <span class="msg" id="codice-msg" ${msg ? '' : 'hidden'}>${esc(msg)}</span></div></div>
        <div class="azioni-p solo"><button class="btn largo" type="submit">${t('ci.continua')}</button></div>
      </form>`;
    $('#f-codice').addEventListener('submit', (e) => { e.preventDefault(); cerca($('#codice').value.trim(), e.submitter); });
  }

  async function cerca(cod, btn) {
    if (!cod) return codice(t('ci.nonTrovato'));
    if (btn) { btn.disabled = true; btn.textContent = t('ci.cercando'); }
    let r;
    try { r = await chiama({ azione: 'cerca', codice: cod }); } catch { return codice(t('ci.offline')); }
    if (!r.ok) return codice(t('ci.nonTrovato'));
    if (r.dati.bloccato) { ci.codice = cod; return codice(t('ci.bloccato')); }
    ci.codice = cod;
    ci.prenotazione = r.dati;
    ci.tipo = r.dati.tipo_gruppo || 'famiglia';
    ci.ospiti = Array.from({ length: r.dati.ospiti }, (_, i) => ({ ordine: i }));
    ci.indice = 0; avanza(1);
  }

  const serveRetro = (tdoc) => tdoc !== 'PASOR';
  // Dati dell'ospite nel formato atteso dal server
  const perServer = (o) => ({ nome: o.nome, cognome: o.cognome, sesso: o.sesso, nascita: o.nascita, nato: o.nato, comune: italia(o.nato) ? o.comune : '', citt: o.citt, res: o.res, resItalia: italia(o.res), resLoc: o.resLoc, tdoc: o.tdoc, ndoc: o.ndoc, rilascio: o.rilascio });

  function ospite() {
    const p = ci.prenotazione, i = ci.indice, o = ci.ospiti[i], titolare = i === 0;
    const capo0 = ci.ospiti[0];
    if (titolare && !o.tdoc) o.tdoc = 'IDELE';
    // Chi viaggia con il titolare di solito vive nello stesso posto: precompiliamo, resta modificabile.
    if (!titolare && o.res === undefined) { o.res = capo0.res; o.resLoc = capo0.resLoc; }
    const campoIn = (id, l, v, ph = '', cls = '', extra = '') => `<label for="${id}">${l}</label><input id="${id}" class="${cls}" value="${esc(v)}" placeholder="${esc(ph)}" autocomplete="off" ${extra}><span class="msg" hidden></span><div class="suggerimenti" hidden></div>`;
    const campo = (...a) => `<div class="campo">${campoIn(...a)}</div>`;
    const paese = (id, l, v) => campo(id, l, v ?? (lingua === 'it' ? 'Italia' : ''), t('ci.paeseEs'), '', 'list="paesi"');
    const nomeAttr = 'autocapitalize="words" spellcheck="false"';
    const slot = (lato, etichetta) => {
      const f = lato === 'retro' ? o.fotoRetro : o.foto, st = (o.fotoStato ?? {})[lato] ?? {};
      const stato = st.controllo ? `<span class="stato">${t('ci.fotoControllo')}</span>`
        : st.errore ? `<span class="stato ko">${t(st.errore)}</span>`
        : !f && st.manca ? `<span class="stato ko">${t('ci.fotoManca', { l: etichetta.toLowerCase() })}</span>`
        : st.avviso ? `<span class="stato attenzione">${t(st.avviso)}</span><button type="button" class="usa" data-tieni="${lato}">${t('ci.usaComunque')}</button>`
        : f ? `<span class="stato ok">${t('ci.fotoBuona')}</span>` : `<span>${t('ci.tocca')}</span>`;
      return `<label class="doc ${f && !st.avviso ? 'letto' : ''} ${st.errore || st.manca ? 'errore' : ''}" data-slot="${lato}">
        <input type="file" accept="image/*" data-foto="${lato}" aria-label="${esc(etichetta)}">
        ${f ? `<img class="anteprima" src="${f}" alt="">` : `<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M14 10h4M14 14h4M6.5 16c.6-1.4 1.6-2 2.5-2s1.9.6 2.5 2"/></svg></span>`}
        <div><strong>${etichetta}</strong>${stato}</div></label>`;
    };
    const ril = () => o.tdoc === 'PASOR' && italia(o.citt) ? t('ci.rilascioPass') : italia(o.citt ?? (lingua === 'it' ? 'Italia' : '')) ? t('ci.rilascioIT') : t('ci.rilascioEstero');

    schermo.innerHTML = `
      ${datalist()}
      ${titolare ? `
        <h3>${t('ci.ciao', { n: esc(p.nome) })}</h3>
        <div class="prenot">
          <div><small>${t('ci.arrivo')}</small><b>${dataBreve(p.arrivo)}</b></div>
          <div><small>${t('ci.notti')}</small><b>${p.notti}</b></div>
          <div><small>${t('ci.ospiti')}</small><b>${p.ospiti}</b></div>
        </div>
        ${p.completato ? `<p class="sotto" style="margin-top:12px">${t('ci.gia')}</p>` : ''}
        ${p.ospiti > 1 ? `<div class="campo" style="margin-top:16px"><label id="tipo-l">${t('ci.viaggiate')}</label>
          <div class="seg" role="group" aria-labelledby="tipo-l">
            <button type="button" data-tipo="famiglia" aria-pressed="${ci.tipo === 'famiglia'}">${t('ci.famiglia')}</button>
            <button type="button" data-tipo="gruppo" aria-pressed="${ci.tipo === 'gruppo'}">${t('ci.gruppo')}</button>
          </div></div>` : ''}
        <div class="docblocco">
          <div><h4 style="font-size:19px">${t('ci.docTitolo')}</h4><p class="sotto" style="margin-top:4px">${t('ci.docSotto')}</p></div>
          <div class="campo"><label for="tdoc">${t('ci.tdoc')}</label><select id="tdoc">${opts(T[lingua].documenti, o.tdoc)}</select><span class="msg" hidden></span><div class="suggerimenti" hidden></div></div>
          <ul class="consigli">${T[lingua]['ci.consigli'].map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
          <div class="slot-griglia">
            ${slot('fronte', serveRetro(o.tdoc) ? t('ci.fronte') : t('ci.pagina'))}
            ${serveRetro(o.tdoc) ? slot('retro', t('ci.retro')) : ''}
          </div>
        </div>` : `
        <h3>${t('ci.ospiteN', { i: i + 1, n: p.ospiti })}</h3>
        <p class="sotto">${t('ci.ospiteSotto')}</p>`}
      <form id="f-ospite" novalidate>
        <div class="campi">
          ${campo('nome', t('ci.nome'), o.nome, '', '', nomeAttr)}
          ${campo('cognome', t('ci.cognome'), o.cognome, '', '', nomeAttr)}
          <div class="campo"><label for="nascita">${t('ci.nascita')}</label><input id="nascita" type="date" value="${esc(o.nascita)}" max="${new Date().toISOString().slice(0, 10)}" min="1900-01-01"><span class="msg" hidden></span><div class="suggerimenti" hidden></div></div>
          <div class="campo"><label for="sesso">${t('ci.sesso')}</label><select id="sesso"><option value="">${t('ci.seleziona')}</option>${opts([['F', t('ci.f')], ['M', t('ci.m')]], o.sesso)}</select><span class="msg" hidden></span></div>
          ${paese('nato', t('ci.paese'), o.nato)}
          <div class="campo" id="w-comune" ${italia(o.nato ?? (lingua === 'it' ? 'Italia' : '')) ? '' : 'hidden'}>${campoIn('comune', t('ci.comune'), o.comune, t('ci.comuneEs'))}</div>
          ${paese('citt', t('ci.citt'), o.citt)}
          ${paese('res', t('ci.resid'), o.res)}
          <div class="campo" id="w-resloc">${campoIn('resloc', italia(o.res ?? (lingua === 'it' ? 'Italia' : '')) ? t('ci.residCom') : t('ci.residLoc'), o.resLoc, t('ci.residEs'))}</div>
          ${titolare ? `
          ${campo('ndoc', t('ci.ndoc'), o.ndoc, '', 'codice', 'autocapitalize="characters" spellcheck="false"')}
          ${campo('rilascio', t('ci.rilascio'), o.rilascio, ril())}` : ''}
        </div>
        <div class="azioni-p">
          <button class="btn vuoto" type="button" id="indietro">${t('ci.indietro')}</button>
          <button class="btn" type="submit" id="avanti">${i < p.ospiti - 1 ? t('ci.avanti') : t('ci.rivedi')}</button>
        </div>
      </form>`;

    function salva() {
      const v = (id) => $('#' + id)?.value.trim() ?? '';
      Object.assign(o, { nome: v('nome'), cognome: v('cognome'), nascita: v('nascita'), sesso: v('sesso'), nato: v('nato'), comune: v('comune'), citt: v('citt'), res: v('res'), resLoc: v('resloc') });
      if (titolare) Object.assign(o, { tdoc: v('tdoc') || o.tdoc, ndoc: v('ndoc').toUpperCase(), rilascio: v('rilascio') });
    }
    ci.salva = salva;

    // --- Messaggi sotto i campi (errori in rosso, consigli in giallo, suggerimenti cliccabili)
    function mostra(messaggi, soloCampi = null) {
      o.messaggi = messaggi;
      schermo.querySelectorAll('.campo').forEach((box) => {
        const el = box.querySelector('input,select'); if (!el || !el.id || el.id === 'codice') return;
        if (soloCampi && !soloCampi.includes(el.id)) return;
        const m = box.querySelector('.msg'), sg = box.querySelector('.suggerimenti');
        const mio = messaggi.filter((x) => x.campo === el.id);
        const err = mio.find((x) => x.livello === 'errore'), avv = mio.find((x) => x.livello === 'avviso'), uno = err || avv;
        box.classList.toggle('errore', !!err); box.classList.toggle('avviso', !err && !!avv);
        if (m) { m.hidden = !uno; m.textContent = uno ? uno[lingua] : ''; m.classList.toggle('avviso', !err && !!avv); }
        if (sg) {
          const scelte = uno ? (uno.opzioni ?? (uno.suggerito ? [uno.suggerito] : [])) : [];
          sg.hidden = !scelte.length;
          sg.innerHTML = scelte.map((v) => `<button type="button" data-valore="${esc(v)}">${esc(el.tagName === 'SELECT' ? (T[lingua].documenti.find((d) => d[0] === v)?.[1] ?? v) : (uno.opzioni ? v : t('ci.usa', { v })))}</button>`).join('');
          sg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
            el.value = b.dataset.valore; el.dispatchEvent(new Event('change', { bubbles: true }));
            if (el.id === 'tdoc') { salva(); render(); } else controlla();
          }));
        }
      });
    }
    // Controlli istantanei sui nomi, mentre si scrive (prima ancora del server)
    const localeNome = (v) => /-/.test(v) ? { campo: '', livello: 'errore', it: 'Niente trattini: al loro posto metti uno spazio (es. "Rossi Bianchi").', en: 'No hyphens: use a space instead (e.g. "Smith Jones").', suggerito: v.replace(/-+/g, ' ').replace(/\s+/g, ' ').trim() }
      : /\d/.test(v) ? { campo: '', livello: 'errore', it: 'Il nome non può contenere numeri.', en: 'Names cannot contain numbers.' } : null;
    ['nome', 'cognome'].forEach((id) => $('#' + id).addEventListener('input', (e) => {
      const x = localeNome(e.target.value);
      mostra([...(o.messaggi ?? []).filter((m) => m.campo !== id), ...(x ? [{ ...x, campo: id }] : [])], [id]);
    }));
    const ndoc = $('#ndoc');
    if (ndoc) ndoc.addEventListener('input', () => { const pos = ndoc.selectionStart; ndoc.value = ndoc.value.toUpperCase(); ndoc.setSelectionRange(pos, pos); });

    // Controllo completo sul server (stesse regole della Questura), con un piccolo ritardo
    let timer, giro = 0;
    async function controlla() {
      salva();
      const mio = ++giro;
      let r; try { r = await chiama({ azione: 'verifica', codice: ci.codice, indice: i, ospite: perServer(o) }); } catch { return null; }
      if (mio !== giro || !r.ok) return null;
      mostra(r.dati.messaggi ?? []);
      return r.dati.messaggi ?? [];
    }
    const piano = () => { clearTimeout(timer); timer = setTimeout(controlla, 350); };
    schermo.querySelectorAll('#f-ospite input, #f-ospite select').forEach((el) => el.addEventListener('change', piano));
    if (o.messaggi?.length) mostra(o.messaggi);

    schermo.querySelectorAll('[data-tipo]').forEach((b) => b.addEventListener('click', () => {
      ci.tipo = b.dataset.tipo;
      schermo.querySelectorAll('[data-tipo]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    }));
    $('#nato').addEventListener('input', (e) => { $('#w-comune').hidden = !italia(e.target.value); });
    $('#res').addEventListener('input', (e) => { $('#w-resloc label').textContent = italia(e.target.value) ? t('ci.residCom') : t('ci.residLoc'); });
    $('#citt').addEventListener('change', () => { const r = $('#rilascio'); if (r) { salva(); r.placeholder = ril(); } });
    const tdoc = $('#tdoc');
    if (tdoc) tdoc.addEventListener('change', () => { salva(); if (!serveRetro(o.tdoc)) { delete o.fotoRetro; } render(); setTimeout(controlla, 0); });

    // --- Foto
    schermo.querySelectorAll('[data-foto]').forEach((inp) => inp.addEventListener('change', async () => {
      const f = inp.files[0], lato = inp.dataset.foto; if (!f) return;
      salva();
      o.fotoStato = { ...(o.fotoStato ?? {}), [lato]: { controllo: true } }; render();
      const r = await preparaFoto(f);
      if (r.errore) { o.fotoStato[lato] = { errore: r.errore }; if (lato === 'retro') delete o.fotoRetro; else delete o.foto; }
      else { o.fotoStato[lato] = r.avviso ? { avviso: r.avviso } : {}; if (lato === 'retro') o.fotoRetro = r.dati; else o.foto = r.dati; }
      render();
    }));
    schermo.querySelectorAll('[data-tieni]').forEach((b) => b.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation(); salva(); o.fotoStato[b.dataset.tieni] = {}; render();
    }));

    $('#indietro').addEventListener('click', () => { salva(); if (i === 0) avanza(0); else { ci.indice--; render(); } });
    $('#f-ospite').addEventListener('submit', async (e) => {
      e.preventDefault(); salva();
      const obblig = ['nome', 'cognome', 'nascita', 'sesso', 'nato', 'citt', 'res', 'resloc'];
      if (italia(o.nato)) obblig.push('comune');
      if (titolare) obblig.push('ndoc', 'rilascio');
      const vuoti = obblig.filter((id) => !$('#' + id).value.trim()).map((id) => ({ campo: id, livello: 'errore', it: T.it['ci.obblig'], en: T.en['ci.obblig'] }));
      // Foto obbligatorie per il titolare: fronte (o pagina passaporto) e, per carta/patente, retro
      let fotoOk = true;
      if (titolare) {
        const lati = serveRetro(o.tdoc) ? ['fronte', 'retro'] : ['fronte'];
        o.fotoStato = o.fotoStato ?? {};
        lati.forEach((l) => {
          const c = l === 'retro' ? o.fotoRetro : o.foto, st = o.fotoStato[l] ?? {};
          if (!c || st.errore) { fotoOk = false; o.fotoStato[l] = { ...st, errore: st.errore ?? null, manca: true }; }
          else if (st.avviso) fotoOk = false;
        });
      }
      if (vuoti.length || !fotoOk) {
        if (!fotoOk) { render(); mostra(vuoti); const d = schermo.querySelector('.doc.errore, .doc:not(.letto)'); d?.scrollIntoView({ block: 'center' }); return; }
        mostra(vuoti); $('#' + vuoti[0].campo).focus(); return;
      }
      const btn = $('#avanti'); const testo = btn.textContent; btn.disabled = true; btn.textContent = t('ci.controllo');
      clearTimeout(timer);
      const msg = await controlla();
      btn.disabled = false; btn.textContent = testo;
      const errori = (msg ?? []).filter((m) => m.livello === 'errore');
      if (errori.length) { const el = $('#' + errori[0].campo); el?.focus(); el?.closest('.campo')?.scrollIntoView({ block: 'center' }); return; }
      ci.salva = null;
      if (i < p.ospiti - 1) { ci.indice++; render(); } else avanza(2);
    });
  }

  function riepilogo(msg = '') {
    const p = ci.prenotazione;
    const ruolo = (i) => p.ospiti === 1 ? t('ruolo.singolo') : i === 0 ? t(ci.tipo === 'famiglia' ? 'ruolo.capoF' : 'ruolo.capoG') : t(ci.tipo === 'famiglia' ? 'ruolo.fam' : 'ruolo.membro');
    const spuntato = $('#ok-privacy')?.checked ?? false;
    schermo.innerHTML = `
      <h3>${t('ci.giusto')}</h3>
      <p class="sotto">${t('ci.giustoSotto')}</p>
      <div class="riepilogo">
        ${ci.ospiti.map((o, i) => `<div class="persona"><div><b>${esc(o.nome)} ${esc(o.cognome)}</b>
          <small>${giorno(o.nascita).toLocaleDateString(locale())}${i === 0 ? ' · ' + esc(o.ndoc) : ''}</small></div>
          <span class="badge">${ruolo(i)}</span></div>`).join('')}
      </div>
      <form id="f-conferma" novalidate>
        <div class="consenso"><input type="checkbox" id="ok-privacy" ${spuntato ? 'checked' : ''}>
          <label for="ok-privacy">${t('ci.consenso')}</label></div>
        ${msg ? `<p class="msg" role="alert" style="color:var(--errore);font-weight:500;font-size:14px;margin-top:12px">${esc(msg)}</p>` : ''}
        <div class="azioni-p">
          <button class="btn vuoto" type="button" id="indietro">${t('ci.modifica')}</button>
          <button class="btn" type="submit" id="invia" ${spuntato ? '' : 'disabled'}>${t('ci.completa')}</button>
        </div>
      </form>`;
    $('#ok-privacy').addEventListener('change', (e) => { $('#invia').disabled = !e.target.checked; });
    $('#indietro').addEventListener('click', () => { ci.indice = ci.ospiti.length - 1; avanza(1); });
    $('#f-conferma').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#invia'); btn.disabled = true; btn.textContent = t('ci.inviando');
      const corpo = {
        azione: 'completa', codice: ci.codice, tipo_gruppo: ci.tipo,
        foto: ci.ospiti[0].foto || '',
        foto_retro: serveRetro(ci.ospiti[0].tdoc) ? (ci.ospiti[0].fotoRetro || '') : '',
        ospiti: ci.ospiti.map(perServer),
      };
      let r;
      try { r = await chiama(corpo); } catch { return riepilogo(t('ci.offline')); }
      if (r.ok) return avanza(3);
      if (r.dati.errore === 'gia_registrato') return riepilogo(t('ci.bloccato'));
      if (r.dati.errore === 'campi') { ci.indice = (r.dati.ospite || 1) - 1; ci.ospiti[ci.indice].messaggi = r.dati.messaggi ?? []; return avanza(1); }
      if (/^foto/.test(r.dati.errore || '')) {
        // La foto non va bene per il server: torniamo al documento e lo segnaliamo sul lato giusto
        const o0 = ci.ospiti[0], lato = r.dati.lato || 'fronte';
        const chiave = { foto_formato: 'ci.fotoFormato', foto_piccola: 'ci.fotoPiccola', foto_grande: 'ci.fotoGrande' }[r.dati.errore];
        o0.fotoStato = { ...(o0.fotoStato ?? {}), [lato]: { errore: chiave ?? null, manca: true } };
        if (lato === 'retro') delete o0.fotoRetro; else delete o0.foto;
        ci.indice = 0; return avanza(1);
      }
      riepilogo(t('ci.erroreInvio'));
    });
  }

  function fatto() {
    const p = ci.prenotazione;
    schermo.innerHTML = `
      <div class="fatto">
        <span class="logo-m ape" aria-hidden="true"></span>
        <h3>${t('ci.fatto')}</h3>
        <p class="sotto">${t('ci.fattoSotto', { n: p.ospiti, o: p.ospiti === 1 ? t('ci.ospite1') : t('ci.ospiteN2'), d: dataBreve(p.arrivo) })}</p>
      </div>`;
    ci.ospiti.forEach((o) => { delete o.foto; delete o.fotoRetro; });
  }

  // Cambio lingua a metà modulo: salva prima quello che è stato scritto.
  const applica = applicaLingua;
  document.querySelectorAll('[data-lingua]').forEach((b) => b.addEventListener('click', () => { if (ci.salva) ci.salva(); }, { capture: true }));

  // Link personale: /?c=CODICE#checkin
  const daLink = new URLSearchParams(location.search).get('c');
  if (daLink) setTimeout(() => { cerca(daLink); document.getElementById('checkin')?.scrollIntoView(); }, 0);
  applica();
})();
</script>

</body></html>
